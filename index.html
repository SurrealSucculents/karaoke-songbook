<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08040F">
<meta name="robots" content="noindex,nofollow">
<title>Mad Dog Karaoke Songbook</title>
<meta name="description" content="Find a song to sing at Mad Dog Karaoke, and see when the next karaoke nights are.">
<meta property="og:title" content="Mad Dog Karaoke Songbook">
<meta property="og:description" content="Find a song to sing, and see when the next karaoke nights are.">
<meta property="og:url" content="https://maddogkaraoke.co.uk/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308040F'/%3E%3Cpath d='M13 22a4 4 0 1 1-2-3.46V8l12-2v12a4 4 0 1 1-2-3.46V9.36L13 10.7z' fill='%23F2EEF7'/%3E%3C/svg%3E">
<style>
  :root{
    --ground:#08040F; --riser:#150C24; --rail:#2A1B3F; --edge:#3D2A57; --lift:#20143A;
    --ink:#F2EEF7; --dim:#9B8FB0; --faint:#6E6383;
    --part-a:#ED1F61; --part-b:#1FEAED;
    --r:10px; --r-lg:16px; --gap:8px; --pad:16px; --tap:48px; --row:62px;
    --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --num:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
    --glow-a:rgba(237,31,97,.18); --glow-b:rgba(31,234,237,.10);
    --spring:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.5,0,.75,0);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 var(--ui);
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  /* stage lighting: soft pink and cyan glows behind everything */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
       background:radial-gradient(110% 55% at 15% -8%,var(--glow-a),transparent 62%),
                  radial-gradient(90% 50% at 100% 0,var(--glow-b),transparent 60%),var(--ground)}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;
         transition:transform .16s var(--spring),background-color .2s,border-color .2s,color .2s,box-shadow .2s}
  button:active:not([disabled]){transform:scale(.96)}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--part-a);outline-offset:2px}
  .sheet:focus,.page:focus{outline:0}
  .wrap{max-width:640px;margin:0 auto}

  /* ---------- gate ---------- */
  .gate{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
        padding:24px var(--pad) calc(24px + env(safe-area-inset-bottom))}
  .card{width:100%;max-width:380px;background:var(--riser);background:color-mix(in srgb,var(--riser) 88%,transparent);border:1px solid var(--rail);
        border-radius:var(--r-lg);padding:26px 22px 22px;display:grid;gap:16px;animation:rise .5s var(--spring) both}
  .mark{display:inline-flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .mark em{font-style:normal;background:linear-gradient(90deg,var(--part-a),#FF6FA0 45%,var(--part-b));
           -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#fff;
        background:linear-gradient(140deg,var(--part-a),#8A2BE2);box-shadow:0 4px 16px rgba(237,31,97,.4)}
  .logo svg{width:17px;height:17px}
  /* loading equaliser */
  .eq{display:flex;gap:4px;align-items:flex-end;height:22px}
  .eq i{width:5px;border-radius:3px;background:linear-gradient(var(--part-b),var(--part-a));height:100%;
        transform-origin:bottom;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  @keyframes rise{from{opacity:0;translate:0 14px}}
  .card h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:8px 0 0}
  .card p{margin:0;font-size:14px;color:var(--dim)}
  .go{font-weight:700;border:0;border-radius:var(--r);color:#fff;padding:13px 16px;min-height:var(--tap);width:100%;
      background:linear-gradient(135deg,var(--part-a),#B0179E);box-shadow:0 6px 22px -6px rgba(237,31,97,.6)}
  .go[disabled]{opacity:.5;cursor:default}
  .quiet{background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;
         padding:6px 0;min-height:36px;font-size:14px}
  .msg{padding:13px 15px;border-radius:var(--r);font-size:13.5px;line-height:1.4}
  .msg b{display:block;font-weight:600;margin-bottom:2px}
  .msg.stop{background:#2B0D1B;color:#FFC2D4;box-shadow:inset 2px 0 0 var(--part-a)}

  /* ---------- top ---------- */
  .top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);
       background:rgba(8,4,15,.78);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px)}
  .bar{display:flex;align-items:center;gap:10px;padding:12px var(--pad) 10px}
  .share{flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;
         border:1px solid var(--rail);border-radius:var(--r);background:transparent;font-size:14px;font-weight:600}
  .share svg{width:16px;height:16px}
  /* search lives in the filter row: a button that opens into a field */
  .filters .find{flex:0 0 42px;padding:0;display:grid;place-items:center;color:var(--ink)}
  .filters .find svg{width:18px;height:18px}
  .filters.searching > button,.filters.saved > button:not(.find){display:none}
  .filters.saved .find{margin-left:auto}
  .search{flex:1;position:relative;animation:open .3s var(--spring) both}
  @keyframes open{from{opacity:0;clip-path:inset(0 0 0 85% round 12px)}}
  .search input{font:inherit;width:100%;padding:9px 44px 9px 40px;min-height:42px;
                border-radius:12px;border:1px solid var(--edge);background:var(--riser);color:var(--ink);
                -webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .25s}
  .search input:focus{outline:0;border-color:var(--part-a);box-shadow:0 0 0 4px rgba(237,31,97,.18)}
  .search .glass{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;
                 color:var(--faint);pointer-events:none;transition:color .2s}
  .search input:focus ~ .glass{color:var(--part-a)}
  .search input::placeholder{color:var(--faint)}
  .search input::-webkit-search-cancel-button{display:none}
  .search .x{position:absolute;right:0;top:0;width:44px;height:42px;border:0;padding:0;
             background:none;color:var(--dim);font-size:22px;line-height:1;border-radius:var(--r)}
  /* segmented control with a sliding highlight */
  .seg{padding:10px var(--pad) 0}
  .tabs{position:relative;display:flex;padding:4px;border-radius:12px;background:var(--riser);border:1px solid var(--rail)}
  .tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:9px;
              background:var(--lift);border:1px solid var(--edge);box-shadow:0 2px 10px rgba(0,0,0,.35);
              transition:transform .38s var(--spring)}
  .tabs[data-on="artists"] .pill{transform:translateX(100%)}
  .tabs[data-on="saved"] .pill{transform:translateX(200%)}
  .tabs button{position:relative;flex:1;font-weight:600;font-size:14px;padding:8px 6px;min-height:38px;border:0;
               background:none;color:var(--dim);white-space:nowrap}
  .tabs button.on{color:var(--ink)}
  .filters button{flex:1;font-weight:600;font-size:14px;padding:9px 6px;min-height:42px;
             border:1px solid var(--rail);border-radius:var(--r);background:transparent;color:var(--dim);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filters button.on{background:rgba(237,31,97,.12);border-color:rgba(237,31,97,.55);color:var(--ink)}
  .tabs .heart{color:var(--part-a);margin-right:4px;display:inline-block}
  .tabs button.on .heart{animation:beat .5s var(--spring)}
  .eyebrow .quiet{margin-left:auto;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;min-height:0;padding:0}
  .filters{display:flex;gap:var(--gap);padding:8px var(--pad) 0}
  .filters button{font-weight:500}
  .filters button .caret{color:var(--faint);margin-left:4px}
  .filters button.clear{flex:0 0 auto;padding:9px 14px;border-color:transparent;color:var(--dim);
                        text-decoration:underline;text-underline-offset:3px}
  .eyebrow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
           padding:14px var(--pad) 6px;border-bottom:1px solid var(--rail);font-variant-numeric:tabular-nums}

  /* ---------- list ---------- */
  .list{position:relative;margin:0 var(--pad)}
  .list.has-rail{margin-right:34px}
  .row{position:absolute;left:0;right:0;height:var(--row);display:grid;grid-template-columns:1fr auto;
       gap:12px;align-items:center;padding:0 8px;margin:0 -6px;border-radius:10px;cursor:pointer;
       transition:background-color .2s}
  .row::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:var(--rail)}
  .row:active{background:var(--lift)}
  @media (hover:hover){.row:hover{background:var(--riser)}}
  .row.enter{animation:rowin .42s var(--spring) both}
  @keyframes rowin{from{opacity:0;translate:0 12px}}
  .tx{min-width:0}
  .t,.a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t{font-size:16px;font-weight:600;line-height:1.25}
  .a{font-size:13px;color:var(--dim);margin-top:2px}
  .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--faint)}
  .n::after{content:" ›";font-family:var(--ui);font-size:17px;color:var(--faint)}
  .empty{padding:40px var(--pad);text-align:center;color:var(--dim);display:grid;gap:12px;justify-items:center;
         animation:rise .4s var(--spring) both}
  .empty b{color:var(--ink);font-size:17px}

  /* A–Z jump rail, like a phone's contacts */
  .jump{position:fixed;right:max(2px,env(safe-area-inset-right));width:30px;z-index:4;display:flex;
        flex-direction:column;justify-content:space-between;touch-action:none;user-select:none;-webkit-user-select:none}
  .jump span{flex:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
             color:var(--dim);min-height:0;line-height:1}
  .jump span.off{color:var(--rail)}
  .bubble{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:22px;
          background:var(--riser);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;
          font-size:44px;font-weight:800;z-index:9;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5);
          animation:pop .2s var(--spring)}

  /* ---------- sheets ---------- */
  .scrim{position:fixed;inset:0;background:rgba(5,2,8,.68);z-index:20;display:flex;align-items:flex-end;justify-content:center;
         -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .25s ease-out both}
  .scrim.leaving{animation:fade .22s ease-in reverse both}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-width:640px;max-height:88vh;max-height:88svh;overflow:auto;background:var(--riser);
         border:1px solid var(--rail);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
         padding:10px 20px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px;
         box-shadow:0 -20px 60px rgba(0,0,0,.45);animation:up .45s var(--spring) both}
  .leaving .sheet{animation:down .22s var(--ease-in) both}
  @keyframes up{from{translate:0 100%}}
  @keyframes down{to{translate:0 100%}}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--edge);justify-self:center;margin-bottom:4px}
  .sheet h2{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.15;margin:0}
  .sheet .sub{margin:-8px 0 0;color:var(--dim);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip.on{animation:beat .35s var(--spring)}
  .chip{font-weight:600;font-size:14px;padding:9px 13px;min-height:42px;border:1px solid var(--rail);
        border-radius:var(--r);background:transparent;color:var(--dim);display:inline-flex;align-items:baseline;gap:7px}
  .chip i{font-style:normal;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;
          font-weight:400;color:var(--faint)}
  .chip.on{background:rgba(237,31,97,.14);border-color:rgba(237,31,97,.6);color:var(--ink)}
  .chip.on i{color:var(--dim)}
  .chip[disabled]{opacity:.35;cursor:default}
  .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .acts .go{flex:1}
  .acts .go.small{flex:0 0 auto;width:auto;margin-left:auto;min-height:40px;padding:9px 16px;font-size:14px;white-space:nowrap}

  /* song modal: centred card instead of a bottom sheet */
  .scrim.modal{align-items:center;padding:16px}
  .scrim.modal .sheet{border:1px solid var(--rail);border-radius:var(--r-lg);max-height:calc(100svh - 32px);
                      padding:18px 18px 14px;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .38s var(--spring) both}
  .scrim.modal.leaving .sheet{animation:pop .18s var(--ease-in) reverse both}
  .scrim.modal .grab{display:none}
  @keyframes pop{from{opacity:0;scale:.92;translate:0 10px}}
  @keyframes beat{40%{scale:1.3}}
  .head{display:flex;gap:12px;align-items:flex-start}
  .head > div{flex:1;min-width:0;display:grid;gap:3px}
  .head .sub{margin:0}
  .fav{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;font-size:14px;
       font-weight:600;border:1px solid var(--edge);border-radius:999px;background:transparent;color:var(--ink)}
  .fav b{color:var(--dim);font-size:16px;line-height:1}
  .fav b{display:inline-block}
  .fav[aria-pressed="true"]{background:var(--part-a);border-color:var(--part-a);color:#fff;box-shadow:0 4px 18px -4px rgba(237,31,97,.7)}
  .fav[aria-pressed="true"] b{color:#fff;animation:beat .45s var(--spring)}
  .shared{margin:0;padding:0;list-style:none;border-top:1px solid var(--rail)}
  .shared li{padding:9px 2px;border-bottom:1px solid var(--rail);font-weight:600;font-size:15px}
  .shared li span{display:block;font-weight:400;font-size:13px;color:var(--dim)}
  .head .meta{margin:0;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .ask{margin:0;padding:10px 12px;border-radius:var(--r);background:var(--lift);font-size:14px;color:var(--dim)}

  /* schedule sheet */
  .cal{display:grid;gap:14px}
  .cal h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .cal ol{margin:0;padding:0;list-style:none;border-top:1px solid var(--rail)}
  .cal li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 4px;
          border-bottom:1px solid var(--rail);font-size:15.5px;font-weight:600}
  .cal li span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--part-a)}
  .acts.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--riser);
               padding:10px 0 calc(18px + env(safe-area-inset-bottom));margin-bottom:calc(-18px - env(safe-area-inset-bottom))}

  /* ---------- dates dock: upcoming nights along the bottom ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:1px solid var(--rail);animation:rise .5s .15s var(--spring) both;
        background:rgba(8,4,15,.8);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
        padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .dock .wrap{display:flex;align-items:center;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;
              scroll-padding-inline:var(--pad);padding:0 var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}
  .dock .wrap::-webkit-scrollbar{display:none}
  .dock .lead{flex:0 0 auto;scroll-snap-align:start;font-size:10.5px;font-weight:700;letter-spacing:.14em;
              text-transform:uppercase;color:var(--dim);white-space:nowrap;padding-right:2px}
  .night{flex:0 0 auto;scroll-snap-align:start;padding:3px 10px;white-space:nowrap;font-size:13.5px;font-weight:700;
         border:1px solid var(--rail);border-radius:999px;background:var(--riser)}
  .night span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:5px}
  .night.now{border-color:var(--part-a);box-shadow:inset 0 0 0 1px var(--part-a);animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:inset 0 0 0 1px var(--part-a),0 0 16px rgba(237,31,97,.45)}}
  .night.now span{color:var(--part-a)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:#0B0616;
         font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;pointer-events:none;white-space:nowrap;
         box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .35s var(--spring) both}
  .toast.leaving{animation:pop .2s var(--ease-in) reverse both}

  /* ---------- artist page ---------- */
  .page{position:fixed;inset:0;z-index:10;background:var(--ground);overflow:auto;-webkit-overflow-scrolling:touch;
        box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:slidein .42s var(--spring) both}
  .page.leaving{animation:slidein .24s var(--ease-in) reverse both}
  @keyframes slidein{from{translate:100% 0}}
  .page::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
        background:radial-gradient(100% 45% at 85% -5%,var(--glow-a),transparent 60%)}
  .page-top{position:sticky;top:0;background:rgba(8,4,15,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(8px + env(safe-area-inset-top)) var(--pad) 0;z-index:2}
  .back{background:none;border:0;color:var(--dim);font-size:15px;font-weight:600;min-height:var(--tap);padding:0 12px 0 0}
  .page h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:4px 0 4px;overflow-wrap:anywhere}
  .page .sub{color:var(--dim);font-size:14px;margin:0 0 12px}
  .plain .row{position:relative;height:auto;min-height:var(--row);padding:10px 8px}
  .plain .t,.plain .a{white-space:normal}
  .plain{margin:0 var(--pad);border-top:1px solid var(--rail)}

  /* recommendations, under the saved songs */
  .recs{margin:26px 0 8px;animation:rise .45s .1s var(--spring) both}
  .recs-head{display:flex;align-items:baseline;gap:12px;padding:0 var(--pad)}
  .recs h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em}
  .recs h2 em{font-style:normal;background:linear-gradient(90deg,var(--part-a),var(--part-b));
              -webkit-background-clip:text;background-clip:text;color:transparent}
  .recs-head .quiet{margin-left:auto;font-size:13px;min-height:0;padding:0}
  .recs > .sub{margin:2px var(--pad) 10px;color:var(--dim);font-size:13.5px}
  .recs .row{grid-template-columns:1fr auto}
  .recs .why{display:block;font-size:12px;font-weight:600;color:var(--part-b);margin-top:3px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quick{width:44px;height:44px;margin-right:-8px;border:0;background:none;padding:0;
         color:var(--dim);font-size:26px;line-height:1;display:grid;place-items:center}
  .quick[aria-pressed="true"]{color:var(--part-a);text-shadow:0 0 14px rgba(237,31,97,.5)}
  .quick.pop{animation:beat .45s var(--spring)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                         animation-delay:0s!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<main class="gate" id="gate">
  <div class="card" id="gateCard">
    <div class="mark"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span><span>Mad Dog <em>Karaoke</em></span></div>
    <h1 id="gateTitle">Opening the songbook…</h1>
    <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="msg stop" id="gateMsg" role="alert" hidden></div>
    <button class="go" id="gateGo" type="button" hidden>Try again</button>
  </div>
</main>

<div id="app" hidden>
  <header class="top" id="top">
    <div class="wrap">
      <div class="bar"><span class="mark"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span><span>Mad Dog <em>Karaoke</em></span></span>
        <button class="share" id="shareBook" type="button" aria-label="Share the songbook"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path
          d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button></div>
      <div class="seg"><nav class="tabs" id="tabs" data-on="songs" aria-label="View">
        <span class="pill" aria-hidden="true"></span>
        <button type="button" class="on" data-tab="songs" aria-pressed="true">Songs</button>
        <button type="button" data-tab="artists" aria-pressed="false">Artists</button>
        <button type="button" data-tab="saved" aria-pressed="false"><span class="heart" aria-hidden="true">♥</span>Saved</button>
      </nav></div>
      <div class="filters" id="filters">
        <button type="button" id="fGenre" aria-haspopup="dialog">Genre<span class="caret">▾</span></button>
        <button type="button" id="fDecade" aria-haspopup="dialog">Decade<span class="caret">▾</span></button>
        <button type="button" id="fVoice" aria-haspopup="dialog" hidden>Singer<span class="caret">▾</span></button>
        <button type="button" class="clear" id="fClear" hidden>Clear</button>
        <button type="button" class="find" id="find" aria-label="Search"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path
          d="m20 20-3.5-3.5"/></svg></button>
        <div class="search" id="searchBox" hidden>
          <input id="q" type="search" placeholder="Search songs or artists" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search songs or artists">
          <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
               aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <button class="x" id="qx" type="button" aria-label="Close search">×</button>
        </div>
      </div>
      <div class="eyebrow"><span id="summary" aria-live="polite"></span>
        <button class="quiet" type="button" id="favShare" hidden>Share my list</button></div>
    </div>
  </header>
  <div class="wrap">
    <div class="list" id="list" role="list"></div>
    <section class="recs" id="recs" hidden aria-labelledby="recsTitle">
      <div class="recs-head"><h2 id="recsTitle">Recommended <em>for you</em></h2>
        <button class="quiet" type="button" id="recsMore">Show different ones</button></div>
      <p class="sub">Picked from the songs you've saved.</p>
      <div class="plain" id="recsList" role="list"></div>
    </section>
    <div class="empty" id="empty" hidden>
      <b id="emptyHead">Nothing matches that</b>
      <span id="emptyWhy">Try a different spelling, or fewer filters.</span>
      <button class="quiet" type="button" id="emptyReset">Clear search and filters</button>
    </div>
  </div>
  <nav class="jump" id="jump" aria-label="Jump to letter" hidden></nav>
  <div class="bubble" id="bubble" hidden></div>
  <aside class="dock" id="dock" aria-label="Upcoming karaoke nights" hidden><div class="wrap" id="dockRow" role="list"></div></aside>
</div>

<section class="page" id="artistPage" hidden aria-labelledby="artistName" tabindex="-1">
  <div class="page-top">
    <div class="wrap">
      <button class="back" type="button" id="artistBack">‹ Back</button>
      <h1 id="artistName"></h1>
      <p class="sub" id="artistSub"></p>
    </div>
  </div>
  <div class="wrap"><div class="plain" id="artistList" role="list"></div></div>
  <div class="foot"></div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
</div>

<script>
(() => {
"use strict";

const DATA_URL = "songbook.json";
const SCHEDULE_URL = "schedule.json";
const HOME = location.origin + location.pathname;
const DECADES = [
  {id: "pre60", label: "Pre-60s", test: y => y < 1960},
  {id: "60", label: "60s", test: y => y >= 1960 && y < 1970},
  {id: "70", label: "70s", test: y => y >= 1970 && y < 1980},
  {id: "80", label: "80s", test: y => y >= 1980 && y < 1990},
  {id: "90", label: "90s", test: y => y >= 1990 && y < 2000},
  {id: "00", label: "2000s", test: y => y >= 2000 && y < 2010},
  {id: "10", label: "2010s", test: y => y >= 2010 && y < 2020},
  {id: "20", label: "2020s", test: y => y >= 2020},
];
const $ = id => document.getElementById(id);
const MOTION = !matchMedia("(prefers-reduced-motion: reduce)").matches;
// Play an element's "leaving" animation, then hide it. Showing it again cancels that.
const leaveTimers = new Map();
function leave(el, ms) {
  el.classList.add("leaving");
  clearTimeout(leaveTimers.get(el));
  leaveTimers.set(el, setTimeout(() => { el.hidden = true; el.classList.remove("leaving"); }, MOTION ? ms : 0));
}
function reveal(el) {
  clearTimeout(leaveTimers.get(el));
  el.classList.remove("leaving");
  el.hidden = false;
}
const isOpen = el => !el.hidden && !el.classList.contains("leaving");
const fmt = n => n.toLocaleString("en-GB");
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/&/g, " and ").replace(/['’`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const letterOf = k => { const c = k.charAt(0); return c >= "a" && c <= "z" ? c.toUpperCase() : "#"; };

/* ================================================================ load */

async function loadList() {
  const res = await fetch(DATA_URL, {cache: "no-cache"});
  if (!res.ok) throw new Error("fetch");
  return res.json();
}

// The dates are a nice extra: if they don't load, the songbook still opens without them.
async function loadSchedule() {
  try {
    const res = await fetch(SCHEDULE_URL, {cache: "no-cache"});
    if (!res.ok) return [];
    const data = await res.json();
    return (data.nights || []).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
  } catch {
    return [];
  }
}

const gateTitle = $("gateTitle"), gateGo = $("gateGo"), gateMsg = $("gateMsg");

function gateError(title, body) {
  gateTitle.textContent = "Couldn't open the songbook";
  gateMsg.innerHTML = `<b>${esc(title)}</b>${esc(body)}`;
  gateMsg.hidden = false;
  gateGo.hidden = false;
  $("eq").hidden = true;
}

let busy = false;
async function openBook() {
  if (busy) return;
  busy = true;
  gateTitle.textContent = "Opening the songbook…"; gateMsg.hidden = true; gateGo.hidden = true; $("eq").hidden = false;
  try {
    const [data, nights] = await Promise.all([loadList(), loadSchedule()]);
    start(data, nights);
  } catch (e) {
    gateError("Check you're online", "Then try again.");
  } finally {
    busy = false;
  }
}
gateGo.onclick = openBook;

/* ================================================================ favourites */

// Saved on this device only (localStorage). Keyed by title and artist, not list position,
// so favourites survive the song list being rebuilt.
const FAV_KEY = "mdk-favourites";
const favKey = s => s.t + "\n" + s.by;
let FAVS = new Set();
try { FAVS = new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch {}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS])); } catch {}
  // Asks the browser not to clear them when space runs low; quietly ignored where unsupported.
  navigator.storage?.persist?.().catch(() => {});
}
const isFav = s => FAVS.has(favKey(s));
function toggleFav(s) {
  isFav(s) ? FAVS.delete(favKey(s)) : FAVS.add(favKey(s));
  saveFavs();
}

/* ================================================================ app */

let SONGS = [], ARTISTS = [], GENRES = [], NIGHTS = [];
const VOICES = ["Male", "Female", "Duet"];
const state = {tab: "songs", q: "", genres: new Set(), decades: new Set(), voices: new Set()};
let view = [];   // what the list is showing right now

function start(data, nights) {
  GENRES = data.g;
  NIGHTS = nights;
  ARTISTS = data.a.map((name, i) => {
    const k = fold(name).replace(/^the /, "");
    return {i, name, k, letter: letterOf(k), songs: []};
  });
  SONGS = data.s.map((r, i) => {
    // v2 rows: [title, artist, year, genre, voice, credit?]; v1 rows had the credit in slot 4.
    const v2 = (data.v || 1) >= 2;
    const [t, ai, y, g] = r;
    const credit = v2 ? r[5] : r[4];
    const v = v2 && r[4] > 0 ? r[4] - 1 : -1;
    const artist = ARTISTS[ai];
    const by = credit || artist.name;
    const ft = fold(t);
    const s = {i, t, by, artist, y, g, v, ft, fa: fold(by), letter: letterOf(ft),
               dec: y ? DECADES.findIndex(d => d.test(y)) : -1};
    artist.songs.push(s);
    return s;
  });
  for (const a of ARTISTS) {
    const c = new Map();
    for (const s of a.songs) if (s.g >= 0) c.set(s.g, (c.get(s.g) || 0) + 1);
    a.genre = [...c].sort((x, y) => y[1] - x[1])[0]?.[0] ?? -1;
  }
  $("fVoice").hidden = !SONGS.some(s => s.v >= 0);
  $("gate").hidden = true;
  $("app").hidden = false;
  document.title = "Mad Dog Karaoke";
  // Shared links carry ?song=…&by=… or ?dates; open what was shared, then tidy the address.
  const p = new URLSearchParams(location.search);
  history.replaceState({v: "list"}, "", location.pathname);
  buildDock();
  refresh();
  if (p.has("song")) {
    const s = findSong(p.get("song"), p.get("by") || "");
    if (s) songSheet(s);
  } else if (p.has("t")) {
    const bys = p.getAll("b");
    const found = p.getAll("t").map((t, i) => findSong(t, bys[i] || "")).filter(Boolean);
    if (found.length) sharedFavsSheet([...new Set(found)]);
  } else if (p.has("dates") && upcoming().length) {
    datesSheet();
  }
}

const songMode = () => state.tab !== "artists";

function findSong(t, by) {
  return SONGS.find(s => s.t === t && (!by || s.by === by)) ||
         SONGS.find(s => s.ft === fold(t) && (!by || s.fa === fold(by)));
}

// The Saved tab has no filter row, so filters picked on Songs or Artists don't apply there
// (they're kept for when the guest goes back).
function anyFilter() { return state.tab !== "saved" && (state.genres.size || state.decades.size || state.voices.size); }

function passes(s) {
  if (state.tab === "saved") return true;
  if (state.genres.size && !state.genres.has(s.g)) return false;
  if (state.decades.size && !state.decades.has(s.dec)) return false;
  if (state.voices.size && !state.voices.has(s.v)) return false;
  return true;
}

function matcher(q) {
  const words = fold(q).split(" ").filter(Boolean);
  if (!words.length) return null;
  const whole = words.join(" ");
  return {
    words, whole,
    song(s) {
      const hay = s.ft + " " + s.fa;
      for (const w of words) if (!hay.includes(w)) return -1;
      // "queen" means the band first, then titles that start with it.
      if (s.artist.k === whole.replace(/^the /, "")) return 0;
      if (s.ft.startsWith(whole)) return 1;
      if (words.every(w => s.ft.includes(w))) return 2;
      if (s.fa.startsWith(whole) || words.every(w => s.fa.includes(w))) return 3;
      return 4;
    },
    artist(a) {
      for (const w of words) if (!a.k.includes(w) && !fold(a.name).includes(w)) return -1;
      return a.k.startsWith(whole) || fold(a.name).startsWith(whole) ? 0 : 1;
    },
  };
}

function compute() {
  const m = matcher(state.q);
  if (songMode()) {
    const saved = state.tab === "saved";
    let out = [];
    for (const s of SONGS) {
      if (saved && !isFav(s)) continue;
      if (!passes(s)) continue;
      const score = m ? m.song(s) : 0;
      if (score >= 0) out.push([score, s]);
    }
    if (m) out.sort((a, b) => a[0] - b[0] || a[1].i - b[1].i);
    return out.map(x => x[1]);
  }
  let out = [];
  for (const a of ARTISTS) {
    const score = m ? m.artist(a) : 0;
    if (score < 0) continue;
    const n = anyFilter() ? a.songs.filter(passes).length : a.songs.length;
    if (n) out.push([score, {a, n}]);
  }
  if (m) out.sort((x, y) => x[0] - y[0] || x[1].a.i - y[1].a.i);
  return out.map(x => x[1]);
}

/* ---------------------------------------------------------------- list */

const list = $("list"), jump = $("jump"), bubble = $("bubble");
const ROW = 62;
let pool = new Map();   // position -> element
let entering = false;   // rows drawn straight after a refresh fade in

function refresh(keepScroll) {
  view = compute();
  const filtered = anyFilter();
  const saved = state.tab === "saved";
  const noun = saved ? ["saved song", "saved songs"] : songMode() ? ["song", "songs"] : ["artist", "artists"];
  let summary = plural(view.length, ...noun);
  if (state.q.trim()) summary += ` for “${state.q.trim()}”`;
  $("summary").textContent = summary;
  $("favShare").hidden = !saved || !FAVS.size;
  $("fClear").hidden = !filtered;
  label($("fGenre"), "Genre", [...state.genres].map(g => GENRES[g]));
  label($("fDecade"), "Decade", [...DECADES.keys()].filter(d => state.decades.has(d)).map(d => DECADES[d].label));
  label($("fVoice"), "Singer", [...VOICES.keys()].filter(v => state.voices.has(v)).map(v => VOICES[v]));
  $("empty").hidden = view.length > 0;
  const none = saved && !FAVS.size;
  $("emptyHead").textContent = none ? "No favourites yet" : "Nothing matches that";
  $("emptyWhy").textContent = none
    ? "Tap a song, then Save. Your favourites stay on this phone for next time."
    : state.q.trim()
    ? "Try a different spelling, or just part of the title."
    : "Nothing matches those filters together. Try fewer filters.";
  $("emptyReset").hidden = none;
  list.style.height = view.length * ROW + "px";
  for (const el of pool.values()) el.remove();
  pool.clear();
  buildJump();
  if (!keepScroll) window.scrollTo(0, 0);
  entering = !keepScroll && MOTION;
  draw();
  renderRecs(!keepScroll);
}

function label(btn, name, picked) {
  btn.classList.toggle("on", picked.length > 0);
  btn.firstChild.textContent = picked.length === 0 ? name
    : picked.length === 1 ? picked[0] : `${picked[0]} +${picked.length - 1}`;
}

function rowFor(item, pos) {
  const el = document.createElement("div");
  el.className = "row";
  el.setAttribute("role", "listitem");
  el.style.transform = `translateY(${pos * ROW}px)`;
  if (songMode()) {
    el.innerHTML = `<span class="tx"><span class="t">${esc(item.t)}</span><span class="a">${esc(item.by)}</span></span>` +
                   heartHTML(item);
    el.onclick = () => songSheet(item);
    wireHeart(el, item);
  } else {
    const g = item.a.genre >= 0 ? GENRES[item.a.genre] : "";
    el.innerHTML = `<span class="tx"><span class="t">${esc(item.a.name)}</span><span class="a">${esc(g)}</span></span>` +
                   `<span class="n">${fmt(item.n)}</span>`;
    el.onclick = () => openArtist(item.a);
  }
  return el;
}

let raf = 0;
function draw() {
  raf = 0;
  if ($("app").hidden) return;
  const top = list.getBoundingClientRect().top;
  const first = Math.max(0, Math.floor(-top / ROW) - 8);
  const last = Math.min(view.length, Math.ceil((innerHeight - top) / ROW) + 8);
  for (const [pos, el] of pool) if (pos < first || pos >= last) { el.remove(); pool.delete(pos); }
  const frag = document.createDocumentFragment();
  let k = 0;
  for (let pos = first; pos < last; pos++) {
    if (pool.has(pos)) continue;
    const el = rowFor(view[pos], pos);
    if (entering) { el.classList.add("enter"); el.style.animationDelay = Math.min(k++, 14) * 24 + "ms"; }
    pool.set(pos, el); frag.appendChild(el);
  }
  entering = false;
  list.appendChild(frag);
}
addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(draw); }, {passive: true});
addEventListener("resize", () => { fitDock(); draw(); });

/* ---------------------------------------------------------------- A–Z */

let firstAt = new Map();
function buildJump() {
  firstAt = new Map();
  const searching = state.q.trim().length > 0;
  if (!searching) {
    view.forEach((item, pos) => {
      const l = songMode() ? item.letter : item.a.letter;
      if (!firstAt.has(l)) firstAt.set(l, pos);
    });
  }
  const show = !searching && view.length > 60;
  jump.hidden = !show;
  list.classList.toggle("has-rail", show);
  if (!show) return;
  jump.innerHTML = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"]
    .map(l => `<span class="${firstAt.has(l) ? "" : "off"}" data-l="${l}">${l}</span>`).join("");
  placeJump();
}
function placeJump() {
  const h = $("top").getBoundingClientRect().height;
  jump.style.top = h + 6 + "px";
  jump.style.bottom = dockH ? dockH + 10 + "px" : "calc(10px + env(safe-area-inset-bottom))";
}
function jumpTo(l) {
  const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  let i = letters.indexOf(l);
  while (i < letters.length && !firstAt.has(letters[i])) i++;   // empty letter: next one that has songs
  if (i >= letters.length) return;
  const pos = firstAt.get(letters[i]);
  const listTop = list.getBoundingClientRect().top + scrollY;
  const header = $("top").getBoundingClientRect().height;
  window.scrollTo(0, listTop + pos * ROW - header);
  clearTimeout(bubbleTimer);
  bubble.textContent = l; bubble.hidden = false;
}
function scrub(e) {
  const p = e.touches ? e.touches[0] : e;
  const el = document.elementFromPoint(jump.getBoundingClientRect().left + 15, p.clientY);
  if (el && el.dataset && el.dataset.l) jumpTo(el.dataset.l);
}
let scrubbing = false;
jump.addEventListener("pointerdown", e => {
  scrubbing = true;
  try { jump.setPointerCapture(e.pointerId); } catch {}
  scrub(e);
});
jump.addEventListener("pointermove", e => { if (scrubbing) scrub(e); });
let bubbleTimer = 0;
const endScrub = () => {
  scrubbing = false;
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => (bubble.hidden = true), 250);
};
// iOS Safari doesn't always deliver pointerup to the rail (pointer capture can be lost when the
// page scrolls under the finger), so listen for every way a gesture can end, window-wide.
for (const t of ["pointerup", "pointercancel", "touchend", "touchcancel"]) addEventListener(t, endScrub, {passive: true});
jump.addEventListener("lostpointercapture", endScrub);
addEventListener("blur", endScrub);
document.addEventListener("visibilitychange", endScrub);

/* ---------------------------------------------------------------- controls */

const q = $("q");
let typing = 0;
q.addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => { state.q = q.value; refresh(); }, 90);
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter") q.blur();
  if (e.key === "Escape") { e.stopPropagation(); closeSearch(); }
});
const filters = $("filters"), searchBox = $("searchBox");
function openSearch() {
  filters.classList.add("searching");
  searchBox.hidden = false;
  q.focus();
}
// Closing clears the search too, so a hidden query never narrows the list.
function closeSearch() {
  filters.classList.remove("searching");
  searchBox.hidden = true;
  clearTimeout(typing);
  if (q.value || state.q) { q.value = ""; state.q = ""; refresh(); }
}
$("find").onclick = openSearch;
$("qx").onmousedown = e => e.preventDefault();   // keep the tap from blurring first
$("qx").onclick = closeSearch;
// Tapping away from an empty search folds it back into the button.
q.addEventListener("blur", () => { if (!q.value.trim()) closeSearch(); });

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  state.tab = b.dataset.tab;
  $("tabs").dataset.on = state.tab;
  filters.classList.toggle("saved", state.tab === "saved");
  document.querySelectorAll(".tabs button").forEach(x => {
    x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b);
  });
  q.placeholder = state.tab === "songs" ? "Search songs or artists"
    : state.tab === "saved" ? "Search your favourites" : "Search artists";
  refresh();
});

$("fClear").onclick = () => { state.genres.clear(); state.decades.clear(); state.voices.clear(); refresh(); };
$("emptyReset").onclick = () => { state.genres.clear(); state.decades.clear(); state.voices.clear(); closeSearch(); refresh(); };

/* ---------------------------------------------------------------- sheets */

const scrim = $("scrim"), sheet = $("sheet");
function openSheet(html, wire, modal) {
  scrim.classList.toggle("modal", !!modal);
  sheet.innerHTML = `<div class="grab"></div>` + html;
  reveal(scrim);
  document.body.style.overflow = "hidden";
  history.pushState({v: "sheet"}, "");
  wire?.(sheet);
  sheet.focus({preventScroll: true});
}
function closeSheet(fromHistory) {
  if (!isOpen(scrim)) return;
  leave(scrim, 220);
  document.body.style.overflow = "";
  if (!fromHistory && history.state?.v === "sheet") history.back();
}
scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
addEventListener("keydown", e => { if (e.key === "Escape") { if (isOpen(scrim)) closeSheet(); else if (isOpen($("artistPage"))) history.back(); } });

function countBy(fn, size) {
  const c = new Array(size).fill(0);
  const m = matcher(songMode() ? state.q : "");
  const saved = state.tab === "saved";
  for (const s of SONGS) {
    if (saved && !isFav(s)) continue;
    if (m && m.song(s) < 0) continue;
    const k = fn(s);
    if (k >= 0) c[k]++;
  }
  return c;
}

function pickerSheet(kind) {
  const isGenre = kind === "genre", isVoice = kind === "voice";
  const set = isGenre ? state.genres : isVoice ? state.voices : state.decades;
  const names = isGenre ? GENRES : isVoice ? VOICES : DECADES.map(d => d.label);
  // Counts honour the other filters, so each chip says what tapping it would give.
  const counts = countBy(s => {
    if (isGenre && (state.decades.size && !state.decades.has(s.dec) || state.voices.size && !state.voices.has(s.v))) return -1;
    if (isVoice && (state.genres.size && !state.genres.has(s.g) || state.decades.size && !state.decades.has(s.dec))) return -1;
    if (kind === "decade" && (state.genres.size && !state.genres.has(s.g) || state.voices.size && !state.voices.has(s.v))) return -1;
    return isGenre ? s.g : isVoice ? s.v : s.dec;
  }, names.length);
  const order = isGenre ? [...names.keys()].sort((a, b) => counts[b] - counts[a]) : [...names.keys()];
  const draft = new Set(set);
  const chips = order.map(i => `<button type="button" class="chip${draft.has(i) ? " on" : ""}" data-i="${i}"` +
    `${counts[i] ? "" : " disabled"} aria-pressed="${draft.has(i)}">${esc(names[i])}<i>${fmt(counts[i])}</i></button>`).join("");
  openSheet(`
    <h2 id="sheetTitle">${isGenre ? "Pick genres" : isVoice ? "Pick singer type" : "Pick decades"}</h2>
    <p class="sub">Pick as many as you like.</p>
    <div class="chips">${chips}</div>
    <div class="acts"><button type="button" class="quiet" data-act="none">Clear</button>
      <button type="button" class="go" data-act="show"></button></div>`, el => {
    const go = el.querySelector('[data-act="show"]');
    const preview = () => {
      const saved = new Set(set);
      set.clear(); draft.forEach(v => set.add(v));
      const n = compute().length;
      set.clear(); saved.forEach(v => set.add(v));
      const noun = songMode() ? ["song", "songs"] : ["artist", "artists"];
      go.textContent = n ? `Show ${plural(n, ...noun)}` : `No ${noun[1]} match`;
      go.disabled = !n;
    };
    el.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      const i = +c.dataset.i;
      draft.has(i) ? draft.delete(i) : draft.add(i);
      c.classList.toggle("on", draft.has(i)); c.setAttribute("aria-pressed", draft.has(i));
      preview();
    });
    el.querySelector('[data-act="none"]').onclick = () => {
      draft.clear();
      el.querySelectorAll(".chip").forEach(c => { c.classList.remove("on"); c.setAttribute("aria-pressed", false); });
      preview();
    };
    go.onclick = () => { set.clear(); draft.forEach(v => set.add(v)); closeSheet(); refresh(); };
    preview();
  });
}
$("fGenre").onclick = () => pickerSheet("genre");
$("fDecade").onclick = () => pickerSheet("decade");
$("fVoice").onclick = () => pickerSheet("voice");

function songSheet(s, onArtistPage) {
  const facts = [s.y, s.g >= 0 ? GENRES[s.g] : "", s.v >= 0 ? VOICES[s.v] : ""].filter(Boolean);
  const all = onArtistPage ? 0 : s.artist.songs.length;
  openSheet(`
    <div class="head"><div><h2 id="sheetTitle">${esc(s.t)}</h2><p class="sub">${esc(s.by)}</p>
      ${facts.length ? `<p class="meta">${facts.map(f => esc(String(f))).join(" · ")}</p>` : ""}</div>
      <button type="button" class="fav" data-act="fav"></button></div>
    <p class="ask">Show this to the host with your first name.</p>
    <div class="acts"><button type="button" class="quiet" data-act="close">Close</button>
      <button type="button" class="quiet" data-act="share">Share</button>
      ${all > 1 ? `<button type="button" class="go small" data-act="artist" aria-label="All ${fmt(all)} songs by ${esc(s.artist.name)}">View artist’s ${fmt(all)} songs</button>` : ""}</div>`,
    el => {
      el.querySelector('[data-act="close"]').onclick = () => closeSheet();
      el.querySelector('[data-act="share"]').onclick = () => shareSong(s);
      const fav = el.querySelector('[data-act="fav"]');
      const show = () => {
        fav.setAttribute("aria-pressed", isFav(s));
        fav.innerHTML = isFav(s) ? `<b aria-hidden="true">♥</b>Saved` : `<b aria-hidden="true">♡</b>Save`;
      };
      fav.onclick = () => {
        toggleFav(s); show(); refresh(true); syncHearts();
        if (isFav(s)) toast("Saved to your favourites");
      };
      show();
      const a = el.querySelector('[data-act="artist"]');
      // The sheet's history entry becomes the artist page's, so Back goes to the list.
      if (a) a.onclick = () => {
        clearTimeout(leaveTimers.get(scrim)); scrim.hidden = true; document.body.style.overflow = "";
        openArtist(s.artist, true);
      };
    }, true);
}

/* ---------------------------------------------------------------- sharing */

const toastEl = $("toast");
let toastTimer = 0;
function toast(text) {
  toastEl.textContent = text;
  toastEl.style.bottom = dockH + 16 + "px";
  // Restart the pop-in even if a toast is already showing.
  toastEl.hidden = true; void toastEl.offsetWidth; reveal(toastEl);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => leave(toastEl, 200), 2200);
}

// The phone's own share menu where there is one; otherwise copy the link.
async function share(d) {
  if (navigator.share) {
    try { await navigator.share(d); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(d.text ? `${d.text}\n${d.url}` : d.url);
    toast("Link copied");
  } catch {
    window.prompt("Copy this link", d.url);
  }
}

const shareBook = () => share({
  title: "Mad Dog Karaoke Songbook",
  text: "Find a song to sing at Mad Dog Karaoke",
  url: HOME,
});
const shareSong = s => share({
  title: `${s.t} – ${s.by}`,
  text: `Sing “${s.t}” by ${s.by} at Mad Dog Karaoke`,
  url: `${HOME}?${new URLSearchParams({song: s.t, by: s.by})}`,
});
const shareDates = () => share({
  title: "Mad Dog Karaoke nights",
  text: "Mad Dog Karaoke nights:\n" + upcoming().map(k => {
    const w = whenWord(k);
    return shortDate(k) + (w ? ` (${w.toLowerCase()})` : "");
  }).join("\n"),
  url: HOME + "?dates",
});
$("shareBook").onclick = shareBook;

// The list travels in the link itself, so it also works as a backup: open it on any phone to save them again.
function shareFavs() {
  const songs = SONGS.filter(isFav);
  const p = new URLSearchParams();
  for (const s of songs) { p.append("t", s.t); p.append("b", s.by); }
  share({
    title: "My Mad Dog Karaoke favourites",
    text: "My Mad Dog Karaoke favourites:\n" + songs.map(s => `${s.t} – ${s.by}`).join("\n"),
    url: `${HOME}?${p}`,
  });
}
$("favShare").onclick = shareFavs;

/* ---------------------------------------------------------------- heart buttons */

// One-tap save on any song row. Rows on the Saved tab come and go with it, so that tab is
// rebuilt; elsewhere the button just updates in place.
const heartSong = new WeakMap();
const heartHTML = s => `<button type="button" class="quick" aria-pressed="${isFav(s)}" ` +
  `aria-label="${isFav(s) ? "Remove" : "Save"} ${esc(s.t)}">${isFav(s) ? "♥" : "♡"}</button>`;
function paintHeart(b) {
  const s = heartSong.get(b), on = isFav(s);
  b.setAttribute("aria-pressed", on);
  b.setAttribute("aria-label", `${on ? "Remove" : "Save"} ${s.t}`);
  b.textContent = on ? "♥" : "♡";
}
function wireHeart(row, s) {
  const b = row.querySelector(".quick");
  heartSong.set(b, s);
  b.onclick = e => {
    e.stopPropagation();
    toggleFav(s);
    paintHeart(b);
    if (isFav(s)) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); toast("Saved to your favourites"); }
    if (state.tab === "saved") refresh(true);
  };
}
// After saving from a song card, bring the artist page's hearts up to date.
const syncHearts = () => document.querySelectorAll("#artistList .quick").forEach(paintHeart);

/* ---------------------------------------------------------------- recommendations */

// There are no play counts, so this leans on what each song is: songs that share the
// artist, genre, decade and singer type of the guest's favourites score highest, and
// acts with a big catalogue (a fair sign of a karaoke staple) get a nudge. A little
// seeded randomness keeps the list fresh day to day, and "Show different ones" reshuffles.
let recSeed = Math.floor(Date.now() / 864e5);
function jitter(i) {
  let x = Math.imul(i + 1, 2654435761) ^ recSeed;
  x = Math.imul(x ^ (x >>> 15), 2246822507);
  x = Math.imul(x ^ (x >>> 13), 3266489909);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}

function recommend(n) {
  const favs = SONGS.filter(isFav);
  if (!favs.length) return [];
  const tally = key => {
    const m = new Map();
    for (const f of favs) { const k = key(f); if (k !== -1) m.set(k, (m.get(k) || 0) + 1); }
    return m;
  };
  const G = tally(f => f.g), D = tally(f => f.dec), V = tally(f => f.v), A = tally(f => f.artist);
  const share = (m, k) => (m.get(k) || 0) / favs.length;
  const scored = [];
  for (const s of SONGS) {
    if (isFav(s) || !passes(s)) continue;
    const sameArtist = A.has(s.artist);
    // Only songs that share something real with the favourites.
    if (!sameArtist && !G.has(s.g)) continue;
    const score = 3 * share(G, s.g) + 2 * share(D, s.dec) + share(V, s.v) +
                  0.25 * Math.min(6, Math.log2(s.artist.songs.length)) + 1.2 * jitter(s.i);
    scored.push([score, s]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  // Alternate more from acts they've saved (two each at most) with acts that are new to
  // them (one each), so it's half familiar, half discovery and never one discography.
  const known = [], fresh = [], per = new Map();
  for (const [, s] of scored) {
    const mine = A.has(s.artist), c = per.get(s.artist) || 0;
    if (c >= (mine ? 2 : 1)) continue;
    const q = mine ? known : fresh;
    if (q.length >= n) continue;
    per.set(s.artist, c + 1);
    q.push(s);
    if (known.length >= n && fresh.length >= n) break;
  }
  const out = [];
  for (let i = 0; out.length < n && (i < known.length || i < fresh.length); i++) {
    if (i < known.length) out.push(known[i]);
    if (i < fresh.length && out.length < n) out.push(fresh[i]);
  }
  return out.map(s => ({s, why: reason(s, favs)}));
}

function reason(s, favs) {
  if (favs.some(f => f.artist === s.artist)) return `More from ${s.artist.name}`;
  const close = favs.find(f => f.g === s.g && f.dec === s.dec && s.dec >= 0) || favs.find(f => f.g === s.g);
  return close ? `Like ${close.t}` : "";
}

function renderRecs(animate) {
  const box = $("recsList");
  const show = state.tab === "saved" && FAVS.size > 0 && !state.q.trim();
  const recs = show ? recommend(12) : [];
  $("recs").hidden = !recs.length;
  box.innerHTML = "";
  recs.forEach(({s, why}, k) => {
    const el = document.createElement("div");
    el.className = "row"; el.setAttribute("role", "listitem");
    el.innerHTML = `<span class="tx"><span class="t">${esc(s.t)}</span><span class="a">${esc(s.by)}${s.y ? ` · ${s.y}` : ""}</span>` +
      `${why ? `<span class="why">${esc(why)}</span>` : ""}</span>` +
      heartHTML(s);
    el.onclick = () => songSheet(s);
    wireHeart(el, s);
    if (animate && MOTION) { el.classList.add("enter"); el.style.animationDelay = 160 + k * 30 + "ms"; }
    box.appendChild(el);
  });
}
$("recsMore").onclick = () => { recSeed++; renderRecs(true); };

function sharedFavsSheet(songs) {
  const fresh = () => songs.filter(s => !isFav(s)).length;
  openSheet(`
    <h2 id="sheetTitle">Favourites shared with you</h2>
    <p class="sub">${plural(songs.length, "song", "songs")}. Save them to keep them on this phone.</p>
    <ol class="shared">${songs.map(s => `<li>${esc(s.t)}<span>${esc(s.by)}</span></li>`).join("")}</ol>
    <div class="acts stick"><button type="button" class="quiet" data-act="close">Close</button>
      <button type="button" class="go" data-act="save"></button></div>`, el => {
    const go = el.querySelector('[data-act="save"]');
    const show = () => {
      const n = fresh();
      go.textContent = n ? `Save ${n === songs.length && n > 1 ? "all " : ""}${plural(n, "song", "songs")}` : "All in your favourites";
      go.disabled = !n;
    };
    el.querySelector('[data-act="close"]').onclick = () => closeSheet();
    go.onclick = () => {
      for (const s of songs) FAVS.add(favKey(s));
      saveFavs(); show(); refresh(true);
      toast("Saved to your favourites");
    };
    show();
  });
}

/* ---------------------------------------------------------------- karaoke nights */

const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September",
                "October", "November", "December"];
const pad2 = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const shortDate = k => { const d = dateOf(k); return `${DAYS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const longDate = k => { const d = dateOf(k); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
// Tonight's night stays listed until midnight.
const upcoming = () => { const today = keyOf(new Date()); return NIGHTS.filter(k => k >= today); };
function whenWord(k) {
  const t = new Date();
  if (k === keyOf(t)) return "Tonight";
  t.setDate(t.getDate() + 1);
  return k === keyOf(t) ? "Tomorrow" : "";
}

const dock = $("dock"), dockRow = $("dockRow");
let dockH = 0;
function buildDock() {
  const ks = upcoming();
  dock.hidden = !ks.length;
  dockRow.innerHTML = ks.length ? `<span class="lead">Karaoke nights</span>` + ks.map(k => {
    const d = dateOf(k), w = whenWord(k);
    return `<span class="night${w === "Tonight" ? " now" : ""}" role="listitem" aria-label="${longDate(k)}${w ? `, ${w.toLowerCase()}` : ""}">` +
      `<span>${w || DAYS[d.getDay()].slice(0, 3)}</span>${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}</span>`;
  }).join("") : "";
  dockRow.scrollLeft = 0;
  fitDock();
}
// Keep the list's last rows and the A–Z rail clear of the dock.
function fitDock() {
  dockH = dock.hidden || $("app").hidden ? 0 : dock.offsetHeight;
  $("app").style.paddingBottom = dockH ? dockH + "px" : "";
  placeJump();
}
// A page left open overnight drops last night's date.
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").hidden) buildDock(); });

function datesSheet() {
  const ks = upcoming();
  const months = new Map();
  for (const k of ks) {
    const d = dateOf(k), m = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    if (!months.has(m)) months.set(m, []);
    months.get(m).push(k);
  }
  const cal = [...months].map(([m, days]) => `<section><h3>${m}</h3><ol>` + days.map(k => {
    const w = whenWord(k);
    return `<li>${longDate(k)}${w ? `<span>${w}</span>` : ""}</li>`;
  }).join("") + `</ol></section>`).join("");
  openSheet(`
    <h2 id="sheetTitle">Karaoke nights</h2>
    <p class="sub">${plural(ks.length, "night", "nights")} coming up. Come and sing.</p>
    <div class="cal">${cal}</div>
    <div class="acts stick"><button type="button" class="quiet" data-act="close">Close</button>
      <button type="button" class="go" data-act="share">Share the dates</button></div>`, el => {
    el.querySelector('[data-act="close"]').onclick = () => closeSheet();
    el.querySelector('[data-act="share"]').onclick = shareDates;
  });
}

/* ---------------------------------------------------------------- artist page */

const page = $("artistPage");
let pageScroll = 0;
function openArtist(a, replace) {
  pageScroll = scrollY;
  const songs = a.songs.slice().sort((x, y) => x.i - y.i);
  const g = a.genre >= 0 ? ` · ${GENRES[a.genre]}` : "";
  $("artistName").textContent = a.name;
  $("artistSub").textContent = plural(songs.length, "song", "songs") + g;
  const box = $("artistList");
  box.innerHTML = "";
  for (const s of songs) {
    const el = document.createElement("div");
    el.className = "row"; el.setAttribute("role", "listitem");
    // Second line only when it says something the header doesn't.
    const sub = s.by !== a.name ? s.by : (s.g >= 0 && s.g !== a.genre ? GENRES[s.g] : "");
    el.innerHTML = `<span class="tx"><span class="t">${esc(s.t)}</span>${sub ? `<span class="a">${esc(sub)}</span>` : ""}</span>` +
      heartHTML(s);
    el.onclick = () => songSheet(s, true);
    wireHeart(el, s);
    if (MOTION && box.children.length < 14) {
      el.classList.add("enter"); el.style.animationDelay = 120 + box.children.length * 24 + "ms";
    }
    box.appendChild(el);
  }
  reveal(page);
  page.scrollTop = 0;
  document.body.style.overflow = "hidden";
  replace ? history.replaceState({v: "artist"}, "") : history.pushState({v: "artist"}, "");
  page.focus({preventScroll: true});
}
function closeArtist() {
  leave(page, 240);
  document.body.style.overflow = "";
  window.scrollTo(0, pageScroll);
  draw();
}
$("artistBack").onclick = () => history.back();

addEventListener("popstate", e => {
  if (isOpen(scrim)) { closeSheet(true); return; }
  if (isOpen(page) && e.state?.v !== "artist") closeArtist();
});

/* ---------------------------------------------------------------- go */

if ("scrollRestoration" in history) history.scrollRestoration = "manual";

openBook();
})();
</script>
